<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote WiFi Keyboard • Windows Native Client</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #000000;
            --accent-hover: #333333;
            --success: #10b981;
            --danger: #ef4444;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --accent: #ffffff;
                --accent-hover: #e2e8f0;
            }
            .key-btn {
                background: #334155 !important;
                color: #f8fafc !important;
                border-color: #475569 !important;
            }
            .key-btn:active {
                background: #475569 !important;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        

        body {
            font-family: var(--font);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 16px 24px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 24px;
            font-weight: 900;
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .header-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .badge-ping {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .badge-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-status::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .badge-status.connected {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #166534;
        }
        .badge-status.connected::before { background: #166534; }

        .badge-status.disconnected {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #991b1b;
        }
        .badge-status.disconnected::before { background: #991b1b; }

        .main-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 4px 4px 0px var(--accent);
            transition: transform 0.1s;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-family: monospace;
            font-weight: bold;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-main);
            transition: all 0.1s;
        }

        button:hover {
            background: var(--card-bg);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(2px);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-color);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Área de escritura en vivo */
        .live-area {
            position: relative;
        }

        #live-input {
            width: 100%;
            height: 60px;
            font-size: 20px;
            padding: 16px;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        #live-input:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }

        .focus-banner {
            position: absolute;
            top: -12px;
            right: -12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid var(--accent);
            transition: all 0.3s ease;
        }

        .focus-banner.focused {
            background: #dcfce7;
            color: #166534;
        }

        .focus-banner.unfocused {
            background: #fef3c7;
            color: #92400e;
        }

        /* Párrafo */
        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            font-size: 14px;
            font-family: var(--font);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            margin-bottom: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
        }
        textarea:focus { border-color: var(--accent); }

        .keys-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .key-btn {
            padding: 12px 8px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .key-icon {
            font-size: 16px;
        }

        .terminal {
            background: #0f172a;
            color: #10b981;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            height: 120px;
            overflow-y: auto;
            border: 3px solid var(--accent);
        }

        .terminal-line { margin-bottom: 4px; }
        .terminal-time { color: #64748b; margin-right: 8px; }

        .pulse-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background-color: #000000;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* === SHORTCUTS PANEL === */
        .shortcuts-panel { border: 3px solid var(--accent); border-radius: 12px; overflow: hidden; box-shadow: 4px 4px 0px var(--accent); }
        .sp-header { background: var(--accent); color: var(--bg-color); padding: 12px 20px; font-weight: 800; font-size: 13px; letter-spacing: 1px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .sp-header:hover { opacity: 0.9; }
        .sp-body { background: var(--card-bg); padding: 12px; }
        .sp-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .sp-tab { padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid var(--border-color); border-radius: 20px; background: var(--bg-color); color: var(--text-muted); transition: all 0.15s; }
        .sp-tab.active { background: var(--accent); color: var(--bg-color); border-color: var(--accent); }
        .sp-tab:hover:not(.active) { border-color: var(--accent); color: var(--text-main); }
        .sp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 7px; }
        .sp-btn { padding: 9px 6px 7px; font-size: 10px; font-weight: 700; text-align: center; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; background: var(--bg-color); color: var(--text-main); transition: all 0.1s; line-height: 1.3; }
        .sp-btn:hover { border-color: var(--accent); background: var(--card-bg); transform: translateY(-1px); }
        .sp-btn:active { transform: translateY(1px); background: var(--accent); color: var(--bg-color); }
        .sp-combo { font-family: monospace; font-size: 9px; color: var(--text-muted); margin-top: 3px; display: block; }
    </style>
</head>
<body>

    

    <header>
        <div class="brand">
            <div class="brand-icon">⌨️</div>
            <div>
                <h1>Remote WiFi Keyboard</h1>
                <p>Cliente Windows ➔ Android</p>
            </div>
        </div>

        <div class="header-badges">
            <div class="mode-pill-selector" style="display:inline-flex; background:#181825; border:1px solid #313244; border-radius:8px; padding:2px; margin-right:8px;">
                <button id="btn-mode-code" onclick="setKeyboardMode('code')" style="background:#6366f1; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;" title="Modo Código: Máxima velocidad, keydown/keyup de todas las teclas físicas sin latencia">⚡ Modo Código</button>
                <button id="btn-mode-daily" onclick="setKeyboardMode('daily')" style="background:transparent; color:#a6adc8; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;" title="Modo Diario: Escritura continua con commitText, tildes y borrado inteligente">📝 Modo Diario</button>
            </div>
            <select id="editor-profile" style="background:#1e1e2e; color:#cdd6f4; border:1px solid #45475a; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; margin-right:6px;" title="Perfil de Editor">
                <option value="default">🎯 Default</option>
                <option value="vscode">💜 VS Code</option>
                <option value="intellij">🟠 IntelliJ</option>
                <option value="termux">🖥️ Termux</option>
                <option value="acode">📝 Acode</option>
            </select>
            <button id="btn-mini-mode" onclick="require('electron').ipcRenderer.send('toggle-mini-mode', true)" style="background:#000; color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px; margin-right:8px; display:inline-flex; align-items:center; gap:5px;" title="Activar Mini Player">
                <span style="font-size:16px;">🗗</span> Mini Widget
            </button>
            <div class="badge-ping" id="ping-badge">⏳ -- ms</div>
            <div class="badge-status disconnected" id="status-badge">Desconectado</div>
        </div>
    </header>

    <div class="main-container">
        <!-- Panel de Conexión -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📱 CONEXIÓN CON TELÉFONO</div>
                <button onclick="runBenchmark()" style="font-size: 11px; padding: 4px 8px;">🚀 Test Ping</button>
            </div>
            <div class="input-group">
                <input type="text" id="phone-ip" placeholder="Ej: 192.168.1.101:9999" value="192.168.1.101:9999">
                <button class="btn-primary" onclick="connectPhone()">Conectar</button>
                <button onclick="autoScan()">🔍 Auto-Detectar</button>
            </div>
        </div>

        <!-- Panel de Escritura en Vivo -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">⚡ ESCRITURA ULTRARRÁPIDA (&lt;3MS)</div>
                <div style="font-size: 10px; font-weight: bold; color: var(--text-muted);">Escribe directamente aquí</div>
            </div>
            <div class="live-area">
                <input type="text" id="live-input" placeholder="Haz clic aquí y escribe con tu teclado..." autocomplete="off">
                <div class="focus-banner unfocused" id="focus-banner">
                    <span id="focus-icon">⚠️</span> <span id="focus-text">Ventana sin foco: Haz clic aquí para escribir</span>
                </div>
            </div>
        </div>

        <!-- Panel Párrafo y Dictado -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📝 PÁRRAFO O PORTAPAPELES</div>
            </div>
            <textarea id="paragraph-input" placeholder="Pega texto largo, notas o enlaces para enviar completo al teléfono..."></textarea>
            <div class="input-group" style="justify-content: space-between;">
                <button id="btn-dictate" onclick="toggleDictation()" style="display: flex; align-items: center; gap: 6px;">🎤 Dictar</button>
                <div style="display: flex; gap: 8px;">
                    <button onclick="document.getElementById('paragraph-input').value=''">Limpiar</button>
                    <button class="btn-primary" onclick="sendParagraph()">Enviar al Teléfono 🚀</button>
                </div>
            </div>
        </div>

        <!-- Panel de Shortcuts PRO (dinámico) -->
        <div class="shortcuts-panel">
            <div class="sp-header" onclick="toggleShortcutsPanel()">
                ⌨️ SHORTCUTS DE DEVELOPER
                <span id="sp-toggle">▼</span>
            </div>
            <div class="sp-body" id="sp-body">
                <div class="sp-tabs" id="sp-tabs"></div>
                <div class="sp-grid" id="sp-grid"></div>
            </div>
        </div>

        <!-- Telemetría -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📊 TELEMETRÍA <span class="pulse-dot" id="pulse-dot" style="display:none;"></span></div>
            </div>
            <div class="terminal" id="terminal">
                <div class="terminal-line"><span class="terminal-time">[SYS]</span> Interfaz inicializada.</div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const dgram = require('dgram');
        
        const phoneIpInput = document.getElementById('phone-ip');
        const statusBadge = document.getElementById('status-badge');
        const pingBadge = document.getElementById('ping-badge');
        const terminal = document.getElementById('terminal');
        const pulseDot = document.getElementById('pulse-dot');
        const liveInput = document.getElementById('live-input');
        
        const focusBanner = document.getElementById('focus-banner');
        const focusIcon = document.getElementById('focus-icon');
        const focusText = document.getElementById('focus-text');
        const paragraphInput = document.getElementById('paragraph-input');

        let ws = null;
        let pendingPings = new Map();
        let pingSeq = 0;

        // =========================================================
        // FASE 3 — Optimización: appendLog con buffer + rAF
        // =========================================================
        const logBuffer = [];
        let logFlushScheduled = false;
        function appendLog(msg) {
            logBuffer.push(msg);
            if (!logFlushScheduled) {
                logFlushScheduled = true;
                requestAnimationFrame(flushLogs);
            }
        }
        function flushLogs() {
            const frag = document.createDocumentFragment();
            logBuffer.splice(0).forEach(msg => {
                const time = new Date().toLocaleTimeString('es-ES', {hour12: false});
                const line = document.createElement('div');
                line.className = 'terminal-line';
                line.innerHTML = `<span class="terminal-time">[${time}]</span> ${msg}`;
                frag.appendChild(line);
            });
            terminal.appendChild(frag);
            terminal.scrollTop = terminal.scrollHeight;
            logFlushScheduled = false;
        }

        function triggerPulse() {
            pulseDot.style.display = 'inline-block';
            setTimeout(() => { pulseDot.style.display = 'none'; }, 200);
        }

        function updatePingUI(rtt) {
            pingBadge.innerText = `${rtt} ms`;
            if (rtt < 20) pingBadge.style.color = '#10b981';
            else if (rtt < 50) pingBadge.style.color = '#f59e0b';
            else pingBadge.style.color = '#ef4444';
        }

        function getBaseHost() {
            let host = phoneIpInput.value.trim();
            if (host.startsWith('http://')) host = host.substring(7);
            if (!host.includes(':')) host += ':9999';
            return host;
        }

        // =========================================================
        // FASE 3 — Optimización: WebSocket con reconexión automática
        // =========================================================
        let reconnectDelay = 1000;
        let reconnectTimer = null;
        let manualDisconnect = false;

        function connectWebSocket() {
            if (ws) {
                manualDisconnect = true;
                ws.close();
            }
            manualDisconnect = false;
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            
            const host = getBaseHost();
            const wsUrl = `ws://${host}/ws`;
            
            appendLog(`Intentando WebSocket en ${wsUrl}...`);
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    reconnectDelay = 1000; // reset backoff en éxito
                    appendLog('✅ Conectado a ' + host);
                    statusBadge.className = 'badge-status connected';
                    statusBadge.innerText = 'Conectado';
                    liveInput.focus();
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'pong') {
                            const sentTime = pendingPings.get(data.id);
                            if (sentTime) {
                                const rtt = Math.round(performance.now() - sentTime);
                                updatePingUI(rtt);
                                pendingPings.delete(data.id);
                            }
                                                } else if (data.type === 'logcat') {
                            const fs = require('fs');
                            const path = require('path');
                            const logPath = path.join(__dirname, 'android_crash_logs.txt');
                            fs.writeFileSync(logPath, data.logs, {flag: 'w'});
                            appendLog('🐞 Logs de Android guardados en ' + logPath);
                        } else if (data.type === 'clipboard_sync') {
                            const { clipboard, nativeImage } = require('electron');
                            if (data.contentType === 'text') {
                                window._lastClipboardText = data.content; // evitar bucle
                                clipboard.writeText(data.content);
                                appendLog('📋 Portapapeles actualizado desde el teléfono');
                            } else if (data.contentType === 'image') {
                                const img = nativeImage.createFromDataURL(data.content);
                                window._lastClipboardImageHash = window._getImageHash(img); // evitar bucle
                                clipboard.writeImage(img);
                                appendLog('📸 Imagen del portapapeles actualizada desde el teléfono');
                            }
                        }
                    } catch(e) {}
                };
                
                ws.onclose = () => {
                    appendLog('❌ Desconectado');
                    statusBadge.className = 'badge-status disconnected';
                    statusBadge.innerText = 'Desconectado';
                    ws = null;
                    // Reconexión automática con backoff exponencial (max 30s)
                    if (!manualDisconnect && reconnectDelay <= 30000) {
                        appendLog(`🔄 Reconectando en ${reconnectDelay/1000}s...`);
                        reconnectTimer = setTimeout(() => {
                            reconnectDelay = Math.min(reconnectDelay * 2, 30000);
                            connectWebSocket();
                        }, reconnectDelay);
                    }
                };
                
                ws.onerror = () => {
                    appendLog('⚠️ Error de conexión WebSocket');
                };
            } catch (e) {
                appendLog('⚠️ Error creando WebSocket: ' + e);
            }
        }

        function sendPayload(payload) {
            triggerPulse();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
                return true;
            } else {
                // Fallback a HTTP
                const host = getBaseHost();
                let endpoint = 'type';
                if (payload.type === 'key') endpoint = 'key';
                if (payload.type === 'key_event') endpoint = 'key_event';
                fetch(`http://${host}/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => {});
                return false;
            }
        }

        function sendText(text) {
            if (!text) return;
            sendPayload({ type: 'type', text });
            appendLog(`Texto enviado: "${text.length > 20 ? text.substring(0, 20) + '...' : text}"`);
        }

        function sendKey(key) {
            sendPayload({ type: 'key', key });
            appendLog(`Tecla: ${key}`);
        }

        async function connectPhone() {
            appendLog(`Conectando a ${phoneIpInput.value}...`);
            connectWebSocket();
        }

        async function runBenchmark() {
            appendLog('🚀 Ejecutando test de latencia en ráfaga (10 paquetes)...');
            for (let i = 0; i < 10; i++) {
                const id = ++pingSeq;
                const start = performance.now();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping', id: id, t: start }));
                    pendingPings.set(id, start);
                } else {
                    const host = getBaseHost();
                    const res = await fetch(`http://${host}/api/ping`).catch(() => null);
                    if (res && res.ok) {
                        updatePingUI(Math.round(performance.now() - start));
                    }
                }
                await new Promise(r => setTimeout(r, 80));
            }
            appendLog('✅ Test completado.');
        }


        // =========================================================
        // FASE 3 — Optimización: Ping con requestIdleCallback
        // (No compite con keystrokes en el hilo de render)
        // =========================================================
        function schedulePing() {
            requestIdleCallback(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const id = ++pingSeq;
                    const now = performance.now();
                    pendingPings.set(id, now);
                    // JSON literal pre-armado: evita JSON.stringify por ping
                    ws.send(`{"type":"ping","id":${id},"t":${now}}`);
                }
                setTimeout(schedulePing, 5000); // cada 5s, no 1.5s
            }, { timeout: 3000 });
        }
        schedulePing();

        async function autoScan() {
            appendLog("🔍 Escaneando red local en busca de tu teléfono Android...");
            statusBadge.className = 'badge-status disconnected';
            statusBadge.innerText = 'Escaneando...';
            
            const subnets = ['192.168.1.', '192.168.0.', '192.168.100.'];
            let found = false;

            for (const sub of subnets) {
                if (found) break;
                const promises = [];
                for (let i = 2; i <= 254; i++) {
                    const testUrl = `http://${sub}${i}:9999/api/ping`;
                    promises.push(
                        fetch(testUrl, { signal: AbortSignal.timeout(600) })
                            .then(r => r.ok ? `${sub}${i}:9999` : null)
                            .catch(() => null)
                    );
                }
                const results = await Promise.all(promises);
                for (const r of results) {
                    if (r) {
                        found = true;
                        phoneIpInput.value = r;
                        connectPhone();
                        break;
                    }
                }
            }

            if (!found) {
                appendLog("⚠️ No se detectó automáticamente. Ingresa la IP que muestra la app de tu teléfono.");
            }
        }

        // Focus handling
        window.addEventListener('focus', () => {
            focusBanner.className = 'focus-banner focused';
            focusIcon.innerText = '🟢';
            focusText.innerText = 'Capturando Teclas Físicas';
            liveInput.focus();
        });

        window.addEventListener('blur', () => {
            focusBanner.className = 'focus-banner unfocused';
            focusIcon.innerText = '⚠️';
            focusText.innerText = 'Ventana sin foco: Haz clic aquí para escribir';
        });

        const PROFILES = {
            default: {},
            vscode: {
                'CTRL+SHIFT+KeyP': { type: 'raw', key: 'p', code: 'KeyP', mods: ['CTRL', 'SHIFT'] },
                'CTRL+Backquote': { type: 'raw', key: '`', code: 'Backquote', mods: ['CTRL'] },
                'ALT+ArrowUp': { type: 'raw', key: 'ArrowUp', code: 'ArrowUp', mods: ['ALT'] },
                'ALT+ArrowDown': { type: 'raw', key: 'ArrowDown', code: 'ArrowDown', mods: ['ALT'] }
            },
            intellij: {
                'CTRL+SHIFT+KeyA': { type: 'raw', key: 'a', code: 'KeyA', mods: ['CTRL', 'SHIFT'] },
                'ALT+Enter': { type: 'raw', key: 'Enter', code: 'Enter', mods: ['ALT'] },
                'CTRL+KeyD': { type: 'raw', key: 'd', code: 'KeyD', mods: ['CTRL'] }
            },
            termux: {},
            acode: {}
        };

        function sendRawKey(action, key, code, modifiers) {
            triggerPulse();
            const payload = {
                type: 'key_event',
                action: action,
                key: key,
                code: code,
                modifiers: modifiers,
                timestamp: Date.now()
            };
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
                // Solo loguear keydown para no spamear el log
                if (action === 'keydown') appendLog(`⌨️ ${code}${modifiers.length ? ' ['+modifiers.join('+')+']' : ''}`);
            } else {
                const host = getBaseHost();
                fetch(`http://${host}/api/key_event`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => {});
            }
        }

        // =========================================================
        // FASE 1 — Fix: handleKey unificado — SIEMPRE sendRawKey
        // para teclas especiales (preserva keyup + metaState completo)
        // =========================================================

        // Teclas que son "especiales" y necesitan pasar por sendRawKey
        // El 'code' del evento ya tiene el valor correcto (ShiftLeft, etc.)
        const SPECIAL_CODES = new Set([
            'Backspace', 'Delete', 'Insert', 'Enter', 'NumpadEnter',
            'Tab', 'Space', 'Escape',
            'Home', 'End', 'PageUp', 'PageDown',
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
            'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
            'PrintScreen', 'ScrollLock', 'Pause', 'CapsLock', 'NumLock',
            'ContextMenu',
            'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight',
            'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight',
            'NumpadAdd', 'NumpadSubtract', 'NumpadMultiply', 'NumpadDivide',
            'NumpadDecimal', 'NumpadEnter',
        ]);

        let currentKeyboardMode = localStorage.getItem('rk_keyboard_mode') || 'code';

        function setKeyboardMode(mode) {
            currentKeyboardMode = mode;
            localStorage.setItem('rk_keyboard_mode', mode);
            updateKeyboardModeUI();
            appendLog(`🔄 Perfil cambiado a: ${mode === 'code' ? '⚡ Modo Código (Pro)' : '📝 Modo Diario (Normal)'}`);
            try {
                sendPayload({
                    type: "set_theme",
                    theme: mode === 'code' ? 'pro' : 'daily'
                });
            } catch (e) {}
        }

        function updateKeyboardModeUI() {
            const btnCode = document.getElementById('btn-mode-code');
            const btnDaily = document.getElementById('btn-mode-daily');
            if (!btnCode || !btnDaily) return;
            if (currentKeyboardMode === 'code') {
                btnCode.style.background = '#6366f1';
                btnCode.style.color = '#fff';
                btnDaily.style.background = 'transparent';
                btnDaily.style.color = '#a6adc8';
            } else {
                btnDaily.style.background = '#10b981';
                btnDaily.style.color = '#fff';
                btnCode.style.background = 'transparent';
                btnCode.style.color = '#a6adc8';
            }
        }
        updateKeyboardModeUI();

        function handleKey(e) {
            e.preventDefault();
            
            const key   = e.key;
            const code  = e.code;
            const action = e.type === 'keyup' ? 'keyup' : 'keydown';
            
            let mods = [];
            if (e.ctrlKey)  mods.push('CTRL');
            if (e.shiftKey) mods.push('SHIFT');
            if (e.altKey)   mods.push('ALT');
            if (e.metaKey)  mods.push('META');
            
            // ⚡ MODO CÓDIGO (Programador / Turbo)
            // Transmisión directa y pura de todos los eventos down/up de hardware
            // Soporta combinaciones completas (Ctrl, Alt, Shift, Meta, F1-F12, Esc, Tab, etc.)
            if (currentKeyboardMode === 'code') {
                sendRawKey(action, key, code, mods);
                return;
            }
            
            // 📝 MODO DIARIO (Normal)
            // A — Modificadores (Ctrl/Alt/Meta) → sendRawKey (Ctrl+A, Ctrl+C, Ctrl+V, etc.)
            if (e.ctrlKey || e.altKey || e.metaKey) {
                sendRawKey(action, key, code, mods);
                return;
            }
            
            // B — Teclas especiales → sendRawKey (Backspace, Delete, Enter, Tab, flechas)
            if (SPECIAL_CODES.has(code)) {
                sendRawKey(action, key, code, mods);
                return;
            }
            
            // C — Carácter imprimible → sendText solo en keydown (commitText nativo con acentos)
            if (key.length === 1 && action === 'keydown') {
                sendText(key);
                return;
            }
            
            // D — Cualquier otra tecla
            if (action === 'keydown') {
                sendRawKey(action, key, code, mods);
            }
        }

        liveInput.addEventListener('keydown', handleKey);
        liveInput.addEventListener('keyup', handleKey);

        ipcRenderer.on('simulate-keystroke', (event, keyData) => {
            const mockEvent = {
                preventDefault: () => {},
                type: keyData.type || 'keydown',
                key: keyData.key,
                code: keyData.code,
                ctrlKey: keyData.ctrlKey || false,
                altKey: keyData.altKey || false,
                shiftKey: keyData.shiftKey || false,
                metaKey: keyData.metaKey || false
            };
            handleKey(mockEvent);
        });

        // =========================================================
        // FASE 2 — Panel de Shortcuts (dinámico desde shortcuts.js)
        // =========================================================
        const SHORTCUTS_CATALOG = require('./shortcuts.js');
        let activeShortcutTab = SHORTCUTS_CATALOG[0].id;
        let shortcutsPanelOpen = true;

        function toggleShortcutsPanel() {
            shortcutsPanelOpen = !shortcutsPanelOpen;
            const body = document.getElementById('sp-body');
            const toggle = document.getElementById('sp-toggle');
            body.style.display = shortcutsPanelOpen ? '' : 'none';
            toggle.textContent = shortcutsPanelOpen ? '▼' : '▶';
        }

        function renderShortcutsPanel() {
            const tabsEl = document.getElementById('sp-tabs');
            const gridEl = document.getElementById('sp-grid');

            // Render tabs
            tabsEl.innerHTML = '';
            SHORTCUTS_CATALOG.forEach(cat => {
                const tab = document.createElement('button');
                tab.className = 'sp-tab' + (cat.id === activeShortcutTab ? ' active' : '');
                tab.textContent = cat.label;
                tab.onclick = () => {
                    activeShortcutTab = cat.id;
                    renderShortcutsPanel();
                };
                tabsEl.appendChild(tab);
            });

            // Render grid for active tab
            gridEl.innerHTML = '';
            const activeCat = SHORTCUTS_CATALOG.find(c => c.id === activeShortcutTab);
            if (!activeCat) return;

            activeCat.shortcuts.forEach(sc => {
                const btn = document.createElement('button');
                btn.className = 'sp-btn';
                btn.innerHTML = `${sc.label}<span class="sp-combo">${sc.combo}</span>`;
                btn.title = `Enviar: ${sc.combo}`;
                btn.onclick = () => sendShortcut(sc);
                gridEl.appendChild(btn);
            });
        }

        function sendShortcut(sc) {
            if (sc.type === 'key') {
                sendKey(sc.key);
            } else if (sc.type === 'key_event') {
                // Simular keydown + keyup
                sendRawKey('keydown', sc.code, sc.code, sc.mods || []);
                setTimeout(() => sendRawKey('keyup', sc.code, sc.code, sc.mods || []), 50);
            } else if (sc.type === 'text') {
                sendText(sc.text);
            }
            appendLog(`🖱️ Shortcut: ${sc.combo}`);
            liveInput.focus();
        }

        // Inicializar panel
        renderShortcutsPanel();





        // --- Párrafo Largo y Dictado por Voz ---
        let recognition = null;
        let isDictating = false;
        const btnDictate = document.getElementById('btn-dictate');

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-ES';

            recognition.onstart = () => {
                isDictating = true;
                btnDictate.style.background = '#fecaca'; // Rojo clarito
                btnDictate.style.color = '#ef4444';
                btnDictate.innerText = '🔴 Escuchando...';
                appendLog('🎤 Dictado iniciado');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    if (paragraphInput.value && !paragraphInput.value.endsWith(' ')) {
                        paragraphInput.value += ' ';
                    }
                    paragraphInput.value += finalTranscript;
                }
            };

            recognition.onerror = (e) => {
                appendLog('⚠️ Error de dictado: ' + e.error);
                stopDictation();
            };

            recognition.onend = () => {
                stopDictation();
            };
        }

        function toggleDictation() {
            if (!recognition) {
                alert("Tu sistema no soporta el reconocimiento de voz nativo.");
                return;
            }
            if (isDictating) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopDictation() {
            isDictating = false;
            btnDictate.style.background = '#ffffff';
            btnDictate.style.color = 'var(--text-main)';
            btnDictate.innerText = '🎤 Dictar';
        }
        function sendParagraph() {
            const text = paragraphInput.value;
            if (!text.trim()) return;
            sendText(text);
            paragraphInput.value = '';
            liveInput.focus();
        }

        paragraphInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                sendParagraph();
            }
        });

        let udpServer = null;
        function startUdpDiscovery() {
            try {
                udpServer = dgram.createSocket('udp4');
                udpServer.on('error', (err) => {
                    appendLog(`⚠️ Error UDP: ${err.message}`);
                    udpServer.close();
                });
                udpServer.on('message', (msg, rinfo) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        if (data.app === 'remote-keyboard') {
                            const newIp = `${rinfo.address}:${data.port}`;
                            if (phoneIpInput.value !== newIp && (!ws || ws.readyState !== WebSocket.OPEN)) {
                                appendLog(`📡 Auto-conectando a: ${data.device} en ${newIp}`);
                                phoneIpInput.value = newIp;
                                connectPhone();
                            }
                        }
                    } catch (e) {}
                });
                udpServer.bind(9998, () => {
                    appendLog('🎧 Escuchando auto-descubrimiento en puerto 9998');
                });
            } catch (e) {
                appendLog(`⚠️ No se pudo iniciar UDP: ${e.message}`);
            }
        }
        startUdpDiscovery();

        setTimeout(connectPhone, 500);

        // =========================================================
        // PORTAPAPELES MÁGICO: Polling y Envío (PC -> Móvil)
        // =========================================================
        const { clipboard, nativeImage } = require('electron');
        window._lastClipboardText = clipboard.readText() || '';
        
        window._getImageHash = function(nativeImg) {
            if (!nativeImg || nativeImg.isEmpty()) return '';
            const size = nativeImg.getSize();
            try {
                const bmp = nativeImg.getBitmap();
                const len = bmp.length;
                if (len === 0) return '';
                // Hash ligero con algunos bytes
                const s = bmp[0] + ',' + bmp[Math.floor(len/2)] + ',' + bmp[len-1];
                return `${size.width}x${size.height}_${len}_${s}`;
            } catch(e) {
                return `${size.width}x${size.height}`;
            }
        };

        window._lastClipboardImageHash = '';
        try { window._lastClipboardImageHash = window._getImageHash(clipboard.readImage()); } catch(e) {}

        setInterval(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            try {
                // 1. Text Sync
                const currentText = clipboard.readText();
                if (currentText && currentText !== window._lastClipboardText) {
                    window._lastClipboardText = currentText;
                    appendLog('📋 Sincronizando texto copiado...');
                    sendPayload({ type: 'clipboard_sync', contentType: 'text', content: currentText });
                }

                // 2. Image Sync (solo si hay imágenes disponibles para no sobrecargar)
                const formats = clipboard.availableFormats();
                if (formats.some(f => f.includes('image/'))) {
                    const currentImg = clipboard.readImage();
                    const currentHash = window._getImageHash(currentImg);
                    if (currentHash && currentHash !== window._lastClipboardImageHash) {
                        window._lastClipboardImageHash = currentHash;
                        appendLog('📸 Sincronizando imagen copiada...');
                        sendPayload({ type: 'clipboard_sync', contentType: 'image', content: currentImg.toDataURL() });
                    }
                }
            } catch(e) {}
        }, 500);

    </script>
</body>
