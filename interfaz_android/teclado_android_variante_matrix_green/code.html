<!DOCTYPE html><html class="h-full bg-[#020502]" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Remote WiFi Keyboard - Matrix Green Edition</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            matrix: {
              bg: '#020703',
              surface: '#041307',
              panel: '#071f0d',
              key: '#081a0b',
              keyHover: '#0e2b14',
              border: '#133a1a',
              glow: '#00ff41',
              bright: '#10e050',
              accent: '#22c55e',
              muted: '#1b5e28',
              dim: '#0f3818'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace']
          },
          boxShadow: {
            'matrix-glow': '0 0 15px rgba(0, 255, 65, 0.35)',
            'matrix-key': 'inset 0 1px 0 rgba(0, 255, 65, 0.15), 0 3px 0 #020904, 0 4px 6px rgba(0,0,0,0.6)',
            'matrix-key-active': 'inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 0 #020904'
          }
        }
      }
    }
  </script>
<!-- Custom Matrix Aesthetics -->
<style data-purpose="matrix-theme-styles">
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');

    /* Scanline effect */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Phosphor CRT bloom */
    .text-phosphor {
      color: #00ff41;
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.65), 0 0 12px rgba(0, 255, 65, 0.25);
    }
    
    .text-phosphor-subtle {
      color: #10e050;
      text-shadow: 0 0 4px rgba(16, 224, 80, 0.4);
    }

    /* Key active feedback state */
    .matrix-key-cap:active {
      transform: translateY(2px);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 255, 65, 0.4) !important;
      background-color: #0d3815 !important;
    }
  </style>
</head>
<body class="h-full w-full select-none overflow-hidden bg-[#020502] font-mono text-green-400 antialiased flex flex-col justify-between">
<!-- Subtle CRT Scanline Overlay -->
<div class="scanlines absolute inset-0 z-50 pointer-events-none opacity-40"></div>
<!-- BEGIN: TopNavigation -->
<!-- Header displaying connection status and protocol info -->

<!-- END: TopNavigation -->
<!-- BEGIN: TerminalMonitorArea -->
<!-- Middle section simulating the active payload and status counters -->
<main class="flex-1 flex flex-col justify-end px-4 pb-2 z-10" data-purpose="status-terminal-area">

<!-- State Indicator Row directly aligned with screenshot design -->
<div class="flex flex-col items-center justify-center py-1">
<div class="flex items-center space-x-2 text-xs">
<span class="w-2.5 h-2.5 rounded-full bg-matrix-glow inline-block shadow-matrix-glow animate-pulse"></span>
<span class="text-phosphor-subtle font-medium text-xs">Listo para recibir teclas...</span>
</div>
<div class="text-[11px] text-matrix-muted font-semibold mt-0.5">

</div>
</div>

<!-- BEGIN: InteractiveScript -->
<!-- Handles key tapping effects, counters, sound synthesis (mock), and buffer output -->
<script data-purpose="keyboard-interactivity">
    document.addEventListener('DOMContentLoaded', () => {
      let strokeCount = 0;
      const counterElement = document.getElementById('keystroke-counter');
      const lastKeyElement = document.getElementById('last-key');
      const outputTextElement = document.getElementById('output-text');
      const keys = document.querySelectorAll('.matrix-key-cap');

      keys.forEach((keyButton) => {
        keyButton.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const keyValue = keyButton.getAttribute('data-key');
          
          // Increment stroke counter
          strokeCount += 1;
          counterElement.textContent = strokeCount;
          lastKeyElement.textContent = keyValue;

          // Haptic vibration feedback if supported
          if (navigator.vibrate) {
            navigator.vibrate(15);
          }

          // Buffer simulation
          if (keyValue === 'BACKSPACE') {
            outputTextElement.textContent = outputTextElement.textContent.slice(0, -1);
          } else if (keyValue === 'SPACE') {
            outputTextElement.textContent += ' ';
          } else if (keyValue === 'ENTER') {
            outputTextElement.textContent = '';
          } else if (keyValue !== 'SHIFT' && keyValue !== 'CTRL' && keyValue !== '?123') {
            if (outputTextElement.textContent.length > 32) {
              outputTextElement.textContent = outputTextElement.textContent.slice(-24);
            }
            outputTextElement.textContent += keyValue;
          }
        });
      });
    });
  </script>
<!-- END: InteractiveScript -->
