<!DOCTYPE html><html class="h-full" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Remote WiFi Keyboard - Light Pro Edition</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              50: '#F8FAFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',
            },
            key: {
              light: '#FFFFFF',
              alt: '#E2E8F0',
              accent: '#2563EB',
            }
          },
          boxShadow: {
            'key': '0 2px 0 0 rgba(0, 0, 0, 0.08), 0 3px 6px -1px rgba(0, 0, 0, 0.05)',
            'key-active': '0 0 0 0 rgba(0, 0, 0, 0)',
            'card-soft': '0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 6px -2px rgba(15, 23, 42, 0.02)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Key Styling -->
<style data-purpose="keyboard-layout">
    /* Touch optimization and realistic tactile effects */
    .key-btn {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: all 0.08s ease-in-out;
    }
    .key-btn:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.0) !important;
    }
    /* Android keyboard layout precise flex-shrink setup */
    .keyboard-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
<!-- END: Custom Key Styling -->
</head>
<body class="bg-slate-100/90 text-slate-800 font-sans min-h-full flex flex-col justify-between items-center select-none overflow-x-hidden antialiased">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-md mx-auto flex flex-col min-h-screen justify-between p-3.5 sm:p-4 bg-slate-50/70 border-x border-slate-200/60 shadow-2xl" data-purpose="mobile-viewport">
<!-- BEGIN: TopBar -->

<!-- END: TopBar -->
<!-- BEGIN: VirtualKeyboard -->
<section class="w-full py-2" data-purpose="clean-light-keyboard">
<div class="bg-slate-200/70 p-2 sm:p-2.5 rounded-3xl border border-slate-300/60 shadow-card-soft">
<div class="keyboard-grid">
<!-- Row 1: Numbers (1 - 0) -->
<div class="flex w-full gap-1 sm:gap-1.5" data-purpose="row-numbers">
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">1</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">2</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">3</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">4</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">5</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">6</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">7</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">8</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">9</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">0</button>
</div>
<!-- Row 2: Letters Q - P -->
<div class="flex w-full gap-1 sm:gap-1.5" data-purpose="row-qwerty-upper">
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">q</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">w</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">e</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">r</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">t</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">y</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">u</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">i</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">o</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">p</button>
</div>
<!-- Row 3: Letters A - L -->
<div class="flex w-full gap-1 sm:gap-1.5 px-2.5 sm:px-3" data-purpose="row-qwerty-middle">
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">a</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">s</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">d</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">f</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">g</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">h</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">j</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">k</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">l</button>
</div>
<!-- Row 4: Shift, Letters Z - M, Backspace -->
<div class="flex w-full gap-1 sm:gap-1.5" data-purpose="row-qwerty-bottom">
<!-- Shift Key -->
<button aria-label="Shift" class="key-btn w-[15%] h-12 bg-slate-300/80 text-slate-800 font-black rounded-lg border border-slate-300 shadow-key flex items-center justify-center active:bg-slate-400">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 10l7-7m0 0l7 7m-7-7v18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Letters Z through M -->
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">z</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">x</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">c</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">v</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">b</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">n</button>
<button class="key-btn flex-1 h-12 bg-white text-slate-900 font-bold text-base lowercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">m</button>
<!-- Backspace Key -->
<button aria-label="Backspace" class="key-btn w-[15%] h-12 bg-slate-300/80 text-slate-800 font-bold rounded-lg border border-slate-300 shadow-key flex items-center justify-center active:bg-slate-400">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414A2 2 0 0110.828 5H20a2 2 0 012 2v10a2 2 0 01-2 2h-9.172a2 2 0 01-1.414-.586L3 12z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Row 5: Modifiers, Spacebar & Enter -->
<div class="flex w-full gap-1 sm:gap-1.5" data-purpose="row-bottom-controls">
<!-- Numerical/Symbol toggle -->
<button class="key-btn w-[18%] h-12 bg-white text-slate-900 font-bold text-sm rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center tracking-tight">
              ?123
            </button>
<!-- Ctrl Modifier -->
<button class="key-btn w-[16%] h-12 bg-white text-slate-900 font-bold text-xs sm:text-sm rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center tracking-wider">
              CTRL
            </button>
<!-- Space Bar -->
<button class="key-btn flex-1 h-12 bg-white text-slate-700 font-semibold text-xs tracking-widest uppercase rounded-lg border border-slate-200/90 shadow-key flex items-center justify-center">
              SPACE
            </button>
<!-- Enter Key with subtle high-contrast aesthetic -->
<button class="key-btn w-[22%] h-12 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-lg border border-blue-500 shadow-key flex items-center justify-center tracking-wider">
              ENTER
            </button>
</div>
</div>
</div>
</section>
<!-- END: VirtualKeyboard -->
<!-- BEGIN: StatusAndActions -->
<footer class="w-full flex flex-col items-center pb-3 pt-1 space-y-4" data-purpose="connection-status-and-action-dock">
<!-- Connection and keystroke counter -->
<div class="text-center" data-purpose="status-indicator">
<div class="inline-flex items-center space-x-2 text-emerald-600 font-medium text-sm">
<span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50 animate-ping"></span>
<span class="">Listo para recibir teclas...</span>
</div>
<p class="text-xs text-slate-500 font-medium mt-0.5">
          Pulsaciones: <span class="font-bold text-slate-700" id="keystroke-count">0</span>
</p>
</div>
<!-- Quick action cards (Cambiar Teclado & Panel) matching reference -->
<nav class="grid grid-cols-2 gap-3.5 w-full" data-purpose="footer-navigation-buttons">
<button class="flex items-center justify-center space-x-2 py-3.5 px-4 bg-[#1E2538] hover:bg-[#252E45] active:scale-[0.98] text-white font-semibold text-sm rounded-xl shadow-lg shadow-slate-900/10 transition-all duration-150" type="button">
<span class="text-lg leading-none">🌐</span>
<span class="">Cambiar Teclado</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3.5 px-4 bg-[#1E2538] hover:bg-[#252E45] active:scale-[0.98] text-white font-semibold text-sm rounded-xl shadow-lg shadow-slate-900/10 transition-all duration-150" type="button">
<span class="text-lg leading-none">⚙️</span>
<span class="">Panel</span>
</button>
</nav>
</footer>
<!-- END: StatusAndActions -->
</main>
<!-- END: MainContainer -->
<!-- BEGIN: Interactive Keystroke Feedback Script -->
<script data-purpose="interactive-counter-and-feedback">
    document.addEventListener('DOMContentLoaded', () => {
      let counter = 0;
      const counterEl = document.getElementById('keystroke-count');
      const keys = document.querySelectorAll('.key-btn');

      keys.forEach(key => {
        key.addEventListener('click', () => {
          // Increment keystroke counter on touch/click
          counter++;
          if (counterEl) {
            counterEl.textContent = counter.toString();
          }

          // Optional haptic trigger for supported mobile devices
          if (navigator.vibrate) {
            navigator.vibrate(10);
          }
        });
      });
    });
  </script>
<!-- END: Interactive Keystroke Feedback Script -->


</body></html>
