<!DOCTYPE html>
<html class="" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Remote Keyboard - Server & Diagnóstico (Light Theme)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen select-none antialiased flex flex-col justify-between items-center p-0 m-0">
  <div class="w-full max-w-md min-h-screen bg-slate-50 border-x border-slate-200 flex flex-col justify-between shadow-2xl relative overflow-hidden">
    <!-- Header -->
    <header class="pt-4 px-4 pb-3 bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_#10b981]"></div>
          <span class="text-xs font-mono font-semibold tracking-wider text-slate-600 uppercase">Daemon: Activo (v2.4)</span>
        </div>
        <div class="flex items-center space-x-1.5 bg-sky-50 border border-sky-200 px-2.5 py-1 rounded-full shadow-sm">
          <span class="text-[10px] font-mono text-sky-700 font-bold tracking-tight">PORT: 9999</span>
        </div>
      </div>
      <div class="p-3 bg-white border border-slate-200/80 rounded-xl text-center shadow-sm relative group mb-3">
        <p class="text-[11px] text-slate-500 uppercase tracking-widest font-mono mb-1 font-semibold">Abre esta dirección en tu PC / Navegador</p>
        <div class="flex items-center justify-center space-x-2">
          <span class="text-sky-600 font-mono font-bold text-lg tracking-wider drop-shadow-sm" id="server-url">
            http://192.168.1.101:9999
          </span>
        </div>
      </div>
      <button class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 active:scale-[0.98] transition-all duration-150 text-white font-mono font-extrabold text-sm tracking-wider uppercase shadow-md flex items-center justify-center space-x-2 border border-sky-400/40" id="copy-btn">
        <span class="text-base">📋</span>
        <span id="copy-btn-text">COPIAR DIRECCIÓN URL</span>
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-3 space-y-3.5 overflow-y-auto">
      <!-- Keyboard Setup -->
      <section class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="text-sky-600 text-base">⌨️</span>
            <h2 class="text-xs font-mono font-bold uppercase tracking-wider text-slate-700">Teclado del Sistema</h2>
          </div>
          <span class="text-[10px] bg-slate-100 border border-slate-200 text-slate-600 px-2 py-0.5 rounded font-mono">IME Service</span>
        </div>
        <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200/80 rounded-xl">
          <div>
            <p class="text-xs font-semibold text-slate-800">Estado del Teclado</p>
            <p class="text-[11px] text-slate-500">Habilitado y seleccionado</p>
          </div>
          <span class="px-2.5 py-1 bg-emerald-50 border border-emerald-300 text-emerald-700 text-[10px] font-mono font-bold rounded-full flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ACTIVO
          </span>
        </div>
      </section>

      <!-- Theme Selector: Standard Dark vs AMOLED vs Light -->
      <section class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="text-sky-600 text-base">🎨</span>
            <h2 class="text-xs font-mono font-bold uppercase tracking-wider text-slate-700">Temas Visuales</h2>
          </div>
          <span class="text-[10px] bg-sky-100 border border-sky-300 text-sky-800 px-2 py-0.5 rounded font-mono">LIGHT</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button id="theme-dark-btn" class="p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:border-sky-500/60 text-center transition-all">
            <div class="w-full h-8 rounded-lg bg-[#0b1326] border border-slate-300 mb-1.5 flex items-center justify-center text-xs">🌌</div>
            <span class="text-[10px] font-mono text-slate-700 block">Dark</span>
          </button>
          <button id="theme-amoled-btn" class="p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:border-sky-500/60 text-center transition-all">
            <div class="w-full h-8 rounded-lg bg-black border border-slate-300 mb-1.5 flex items-center justify-center text-xs">⚡</div>
            <span class="text-[10px] font-mono text-slate-700 block">AMOLED</span>
          </button>
          <button id="theme-light-btn" class="p-2.5 rounded-xl border-2 border-sky-500 bg-white text-center transition-all shadow-sm">
            <div class="w-full h-8 rounded-lg bg-slate-100 border border-sky-300 mb-1.5 flex items-center justify-center text-xs">☀️</div>
            <span class="text-[10px] font-mono text-sky-700 font-bold block">Light</span>
          </button>
        </div>
      </section>

      <!-- Telemetry Stats -->
      <section class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="text-sky-600 text-base">📊</span>
            <h2 class="text-xs font-mono font-bold uppercase tracking-wider text-slate-700">Telemetría en Vivo</h2>
          </div>
          <span class="text-[10px] font-mono text-emerald-600">RTT &lt; 3ms</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-center">
            <span class="text-[10px] font-mono text-slate-500 block">Paquetes</span>
            <span class="text-sm font-mono font-bold text-slate-800">1,248</span>
          </div>
          <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-center">
            <span class="text-[10px] font-mono text-slate-500 block">Latencia</span>
            <span class="text-sm font-mono font-bold text-emerald-600">1.8 ms</span>
          </div>
          <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-center">
            <span class="text-[10px] font-mono text-slate-500 block">Batería</span>
            <span class="text-sm font-mono font-bold text-sky-600">MODO DÍA</span>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
