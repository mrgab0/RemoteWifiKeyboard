[package]
name = "remote-keyboard-rust"
version = "1.0.0"
edition = "2021"
authors = ["Gabo"]
description = "Servidor nativo en Rust ultra-ligero para Remote WiFi Keyboard (Windows 10 & 11)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.25.1"
tao = "0.37.0"
wry = "0.57.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
