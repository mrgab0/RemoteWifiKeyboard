<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Keyboard - Mini Widget Flotante Cyberpunk</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    /* Cyberpunk Fire Neon Animated Border */
    @keyframes cyberFire {
      0% {
        background-position: 0% 50%;
        filter: drop-shadow(0 0 10px rgba(255, 60, 0, 0.7)) drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
      }
      50% {
        background-position: 100% 50%;
        filter: drop-shadow(0 0 16px rgba(255, 115, 0, 0.9)) drop-shadow(0 0 26px rgba(0, 150, 255, 0.75));
      }
      100% {
        background-position: 0% 50%;
        filter: drop-shadow(0 0 10px rgba(255, 60, 0, 0.7)) drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
      }
    }

    /* Tooltip Cyberpunk Floating Card */
    .cyber-tooltip {
      position: absolute;
      top: 6px;
      left: 8px;
      width: 224px;
      background: rgba(10, 15, 29, 0.94);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 12px rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(12px);
      z-index: 50;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cyber-tooltip.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .tooltip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .tooltip-title {
      font-family: 'Geist Mono', Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tooltip-body {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tip-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.25;
    }

    .tip-row b {
      color: #ffffff;
      font-weight: 700;
    }

    .tip-icon {
      font-size: 11px;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Circular Widget Container placed at the bottom-left */
    .widget-anchor {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 96px;
      height: 96px;
    }

    .fire-border-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 9999px;
      padding: 3.5px;
      background: linear-gradient(135deg, #ff1a00, #ff7b00, #00f0ff, #0077ff, #ff007b);
      background-size: 300% 300%;
      animation: cyberFire 3s ease infinite;
      cursor: grab;
      transition: all 0.3s ease;
    }

    .fire-border-wrap:active {
      cursor: grabbing;
    }

    /* Cyan-Blue vibrant gradient matching stitch design */
    .widget-btn {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      border: none;
      outline: none;
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.45),
        inset 0 -3px 6px rgba(0, 30, 100, 0.5),
        0 4px 15px rgba(0, 150, 255, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: inherit;
    }

    .widget-btn:hover {
      filter: brightness(1.12);
    }

    /* State OFF Styling when window is blurred / standby */
    .is-off {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.1), inset 0 -2px 4px rgba(0,0,0,0.6) !important;
    }

    .is-off-fire {
      background: linear-gradient(135deg, #334155, #64748b, #1e293b) !important;
      animation: none !important;
      filter: drop-shadow(0 0 6px rgba(100, 116, 139, 0.3)) !important;
    }

    /* Glossy reflection */
    .glass-highlight {
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    /* Scanline pattern */
    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.12) 0px,
        rgba(0,0,0,0.12) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }

    #statusText {
      font-family: 'Geist Mono', Consolas, monospace;
      color: #ffffff;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      z-index: 10;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .sub-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 10;
      margin-top: 4px;
    }

    #statusDot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 0 6px #ffffff;
      transition: all 0.2s ease;
    }

    #subText {
      font-family: 'Geist Mono', Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }

    .is-off #statusText {
      color: #94a3b8 !important;
    }

    .is-off #statusDot {
      background-color: #64748b !important;
      box-shadow: none !important;
    }

    .is-off #subText {
      color: #64748b !important;
    }
  </style>
</head>
<body>

  <!-- Cyberpunk Tooltip Instructivo Flotante -->
  <div id="cyberTooltip" class="cyber-tooltip">
    <div class="tooltip-header">
      <span class="tooltip-title">⚡ REMOTE WIDGET</span>
    </div>
    <div class="tooltip-body">
      <div class="tip-row"><span class="tip-icon">🖱️</span> <span><b>Rueda:</b> Pegar portapapeles</span></div>
      <div class="tip-row"><span class="tip-icon">🎯</span> <span><b>F6:</b> Enfocar caja de texto</span></div>
      <div class="tip-row"><span class="tip-icon">🖰</span> <span><b>Ctrl+Shift+Rueda:</b> Salto Ratón <span id="tip-synergy-status"><b style="color:#94a3b8">OFF</b></span></span></div>
      <div class="tip-row"><span class="tip-icon">⌨️</span> <span><b>Hover:</b> Escribe directo a Android</span></div>
      <div class="tip-row"><span class="tip-icon">✥</span> <span><b>Arrastra:</b> Mover a cualquier sitio</span></div>
      <div class="tip-row"><span class="tip-icon">✨</span> <span><b>2x Clic:</b> Cerrar widget</span></div>
    </div>
  </div>

  <!-- Botón circular Cyberpunk -->
  <div class="widget-anchor">
    <div id="widgetContainer" class="fire-border-wrap is-off-fire">
      <button id="toggleBtn" class="widget-btn is-off">
        <div class="glass-highlight"></div>
        <div class="scanline"></div>
        
        <!-- Estado texto principal -->
        <span id="statusText">OFF</span>

        <!-- Subtítulo o indicador de enlace -->
        <div class="sub-badge">
          <span id="statusDot"></span>
          <span id="subText">STANDBY</span>
        </div>
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const wrap = document.getElementById('widgetContainer');
    const btn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const subText = document.getElementById('subText');
    const tooltip = document.getElementById('cyberTooltip');

    let currentPing = '3ms';
    let isWritingActive = false;
    let appConfig = {
      widgetHoverActivate: true,
      widgetTooltips: true,
      wheelPasteEnabled: true,
      wheelPasteDebounce: 350
    };

    function setFocusState(active) {
      if (active) {
        wrap.classList.remove('is-off-fire');
        btn.classList.remove('is-off');
        statusText.innerText = 'ON';
        subText.innerText = currentPing;
      } else {
        wrap.classList.add('is-off-fire');
        btn.classList.add('is-off');
        statusText.innerText = 'OFF';
        subText.innerText = 'STANDBY';
      }
    }

    ipcRenderer.on('writing-state-changed', (event, active) => {
      isWritingActive = active;
      setFocusState(active);
    });

    ipcRenderer.invoke('get-writing-state').then(active => {
      isWritingActive = active;
      setFocusState(active);
    }).catch(() => {});

    window.addEventListener('focus', () => {
      if (isWritingActive) {
        setFocusState(true);
        ipcRenderer.send('widget-wake-device');
      }
    });
    window.addEventListener('blur', () => {
      hideTooltip();
    });

    // Tooltip Helpers
    function showTooltip() {
      if (appConfig.widgetTooltips) {
        tooltip.classList.add('show');
      }
    }

    function hideTooltip() {
      tooltip.classList.remove('show');
    }

    // Auto-activación al posar el mouse (Hover Activate) y Tooltip
    wrap.addEventListener('mouseenter', () => {
      showTooltip();
      if (appConfig.widgetHoverActivate && isWritingActive) {
        ipcRenderer.send('widget-hover-activate');
        ipcRenderer.send('widget-wake-device');
        setFocusState(true);
      }
    });

    wrap.addEventListener('mouseleave', () => {
      if (!isDragging) {
        hideTooltip();
      }
    });

    // Arrastre Universal y Fluido a cualquier parte de la pantalla
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasMoved = false;

    wrap.addEventListener('mousedown', (e) => {
      if (e.button === 0) { // Clic izquierdo para arrastrar o alternar
        isDragging = true;
        dragStartX = e.screenX;
        dragStartY = e.screenY;
        hasMoved = false;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const deltaX = e.screenX - dragStartX;
        const deltaY = e.screenY - dragStartY;
        if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
          hasMoved = true;
          ipcRenderer.send('widget-move', { deltaX, deltaY });
          dragStartX = e.screenX;
          dragStartY = e.screenY;
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging) {
        isDragging = false;
        if (hasMoved) {
          e.stopPropagation();
        } else {
          // Si fue un clic simple sin arrastrar, alternar estado ON/OFF
          ipcRenderer.send('toggle-writing-state');
        }
      }
    });

    // Doble clic o clic derecho para salir del modo mini
    window.addEventListener('dblclick', (e) => {
      e.preventDefault();
      ipcRenderer.send('close-widget');
    });

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('close-widget');
    });

    // Interceptar pulsación de teclas y retransmitir a la ventana principal SOLO si está activo
    function handleWidgetKey(e) {
      if (e.key === 'F6') {
        e.preventDefault();
        ipcRenderer.send('focus-android-input');
        return;
      }
      if (!isWritingActive) return;
      e.preventDefault();
      const keyData = {
        type: e.type,
        key: e.key,
        code: e.code,
        ctrlKey: e.ctrlKey,
        altKey: e.altKey,
        shiftKey: e.shiftKey,
        metaKey: e.metaKey
      };
      ipcRenderer.send('widget-keystroke', keyData);
    }
    window.addEventListener('keydown', handleWidgetKey);
    window.addEventListener('keyup', handleWidgetKey);

    // Interceptar rueda del ratón (Middle Click / Botón 1) para pegar en Android
    let lastWheelPaste = 0;
    function handleWheelClick(e) {
      if (e.button === 1 && appConfig.wheelPasteEnabled) {
        e.preventDefault();
        e.stopPropagation();
        const now = Date.now();
        const debounce = appConfig.wheelPasteDebounce || 350;
        if (now - lastWheelPaste < debounce) return;
        lastWheelPaste = now;

        // Feedback visual inmediato
        statusText.innerText = '📋';
        setTimeout(() => {
          statusText.innerText = document.hasFocus() ? 'ON' : 'OFF';
        }, 300);

        ipcRenderer.send('widget-paste');
      }
    }
    window.addEventListener('mousedown', handleWheelClick);
    window.addEventListener('auxclick', handleWheelClick);

    // Actualización de Ping desde la ventana principal
    ipcRenderer.on('ping-update', (event, ping) => {
      currentPing = ping + 'ms';
      if (document.hasFocus()) {
        subText.innerText = currentPing;
      }
    });

    // Sincronización de Ajustes
    ipcRenderer.on('settings-sync', (event, settings) => {
      if (settings) {
        appConfig = { ...appConfig, ...settings };
      }
    });

    // Atajo rápido: Ctrl + Shift + Rueda del ratón para alternar Modo Synergy
    let lastSynergyToggle = 0;
    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey && e.shiftKey) {
        e.preventDefault();
        const now = Date.now();
        if (now - lastSynergyToggle < 500) return;
        lastSynergyToggle = now;

        ipcRenderer.send('toggle-synergy-shortcut');

        statusText.innerText = '🖱️';
        setTimeout(() => {
          statusText.innerText = document.hasFocus() ? 'ON' : 'OFF';
        }, 500);
      }
    }, { passive: false });

    ipcRenderer.on('synergy-status-changed', (event, enabled) => {
      const synTip = document.getElementById('tip-synergy-status');
      if (synTip) {
        synTip.innerHTML = enabled
          ? '<b style="color:#00ff88">ON</b>'
          : '<b style="color:#94a3b8">OFF</b>';
      }
    });
  </script>
</body>
</html>
