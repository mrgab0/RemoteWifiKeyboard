<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d182e"/>
      <stop offset="50%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="cyanBlueGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#00c0ff"/>
      <stop offset="100%" stop-color="#0061ff"/>
    </linearGradient>
    <filter id="iconGlowClean" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGradClean)" stroke="url(#cyanBlueGradClean)" stroke-width="2.5"/>

  <!-- Badge PRO Grandecito arriba a la izquierda -->
  <g transform="translate(56, 56)" filter="url(#iconGlowClean)">
    <rect x="0" y="0" width="94" height="38" rx="10" fill="url(#cyanBlueGradClean)"/>
    <text x="47" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="2.5" fill="#040d1a" text-anchor="middle">PRO</text>
  </g>

  <!-- Big Central Composition -->
  <g filter="url(#iconGlowClean)">
    <!-- Nueva Tipografía R: Líneas limpias de gran presencia -->
    <rect x="76" y="128" width="52" height="288" rx="16" fill="url(#cyanBlueGradClean)"/>

    <path d="M 118 128 H 250 C 310 128, 340 156, 340 212 C 340 268, 310 296, 250 296 H 118 Z" fill="url(#cyanBlueGradClean)"/>
    <rect x="128" y="174" width="114" height="76" rx="18" fill="#091428"/>

    <path d="M 226 280 L 316 416 H 248 L 176 304 Z" fill="url(#cyanBlueGradClean)"/>

    <!-- Teclas Minimalistas (Geométricas limpias) -->
    <rect x="360" y="140" width="46" height="46" rx="13" fill="#0f1f3d" stroke="url(#cyanBlueGradClean)" stroke-width="1.8"/>
    <circle cx="383" cy="163" r="5" fill="#00f2fe"/>

    <rect x="418" y="140" width="46" height="46" rx="13" fill="#0f1f3d" stroke="url(#cyanBlueGradClean)" stroke-width="1.8"/>
    <circle cx="441" cy="163" r="5" fill="#00f2fe"/>

    <rect x="360" y="200" width="46" height="46" rx="13" fill="#0f1f3d" stroke="url(#cyanBlueGradClean)" stroke-width="1.8"/>
    <rect x="375" y="221" width="16" height="4" rx="2" fill="#00f2fe"/>

    <rect x="418" y="200" width="46" height="46" rx="13" fill="#0f1f3d" stroke="url(#cyanBlueGradClean)" stroke-width="1.8"/>
    <circle cx="441" cy="223" r="5" fill="#00f2fe"/>

    <!-- Enter Key Minimalista -->
    <rect x="352" y="262" width="112" height="52" rx="15" fill="url(#cyanBlueGradClean)"/>
    <path d="M 424 288 H 390 M 400 279 L 390 288 L 400 297" fill="none" stroke="#040d1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Space Bar limpia -->
    <rect x="344" y="330" width="120" height="38" rx="12" fill="#0f1f3d" stroke="url(#cyanBlueGradClean)" stroke-width="1.8"/>
    <rect x="382" y="347" width="44" height="4" rx="2" fill="#00f2fe"/>
  </g>
</svg>
