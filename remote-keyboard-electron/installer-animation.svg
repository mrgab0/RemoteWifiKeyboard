<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" style="background:0 0;overflow:visible"><defs><linearGradient id="bgGradClean" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d182e"/><stop offset="50%" stop-color="#081020"/><stop offset="100%" stop-color="#040812"/></linearGradient><linearGradient id="cyanBlueGradClean" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="40%" stop-color="#00c0ff"/><stop offset="100%" stop-color="#0061ff"/></linearGradient><linearGradient id="keycapGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#142646"/><stop offset="100%" stop-color="#091428"/></linearGradient><radialGradient id="haloGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".32"/><stop offset="50%" stop-color="#0061ff" stop-opacity=".1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient><filter id="iconGlowClean" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bloomIntense" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="key3dShadow" width="160%" height="180%" x="-30%" y="-30%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".75" stdDeviation="6"/></filter><style>@keyframes masterCameraZoom{0%{transform:scale(.985)}50%{transform:scale(1.025)}}@keyframes centralHaloBreathe{0%{opacity:.22;transform:scale(.94)}50%{opacity:.58;transform:scale(1.06)}}@keyframes proBadgeGlow{0%{filter:drop-shadow(0 0 8px rgba(0,242,254,.4))}50%{filter:drop-shadow(0 0 20px rgba(0,240,255,.85))}}@keyframes laserEnergyRun{0%{stroke-dashoffset:1400;opacity:.15}50%{stroke-dashoffset:700;opacity:.85}}@keyframes keyBacklightPulse{0%{