<svg width="600" height="600" viewBox="0 0 600 600" style="background: transparent; overflow: visible;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Background -->
    <linearGradient id="bgGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d182e"/>
      <stop offset="50%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>

    <!-- Signature Cyber Cyan / Azure Gradient -->
    <linearGradient id="cyanBlueGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#00c0ff"/>
      <stop offset="100%" stop-color="#0061ff"/>
    </linearGradient>

    <!-- Keycap Bevel Gradient -->
    <linearGradient id="keycapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142646"/>
      <stop offset="100%" stop-color="#091428"/>
    </linearGradient>

    <!-- Radial Ambient Halo -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0061ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for High-End Bloom & 3D Drop Shadows -->
    <filter id="iconGlowClean" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bloomIntense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="key3dShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.75"/>
    </filter>

    <style>
      /* KEYFRAME SEQUENCES - CALM, CINEMATIC CYBERPUNK */
      @keyframes masterCameraZoom {
        0%, 100% { transform: scale(0.985); }
        50% { transform: scale(1.025); }
      }

      @keyframes centralHaloBreathe {
        0%, 100% { opacity: 0.22; transform: scale(0.94); }
        50% { opacity: 0.58; transform: scale(1.06); }
      }

      @keyframes proBadgeGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.85)); }
      }

      @keyframes laserEnergyRun {
        0% { stroke-dashoffset: 1400; opacity: 0.15; }
        50% { stroke-dashoffset: 700; opacity: 0.85; }
        100% { stroke-dashoffset: 0; opacity: 0.15; }
      }

      @keyframes keyBacklightPulse {
        0%, 100% { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8)); }
        50% { filter: drop-shadow(0 4px 14px rgba(0, 242, 254, 0.35)); }
      }

      @keyframes enterBloomPulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5)); }
        50% { filter: drop-shadow(0 0 22px rgba(0, 255, 136, 0.75)); }
      }

      @keyframes wifiPulseWave1 {
        0%, 100% { opacity: 0.25; transform: scale(0.96); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes wifiPulseWave2 {
        0%, 100% { opacity: 0.18; transform: scale(0.96); }
        50% { opacity: 0.65; transform: scale(1.06); }
      }

      @keyframes cursorBlink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes ledBlink {
        0%, 100% { fill: #00f2fe; opacity: 0.7; }
        50% { fill: #00ff88; opacity: 1; filter: drop-shadow(0 0 5px #00ff88); }
      }

      .master-camera {
        transform-origin: 300px 300px;
        animation: masterCameraZoom 7s ease-in-out infinite;
      }
      .halo-atmosphere {
        transform-origin: 300px 300px;
        animation: centralHaloBreathe 7s ease-in-out infinite;
      }
      .badge-pro-group {
        animation: proBadgeGlow 4s ease-in-out infinite;
      }
      .anim-key-1, .anim-key-2, .anim-key-3, .anim-key-4, .anim-key-space {
        animation: keyBacklightPulse 4s ease-in-out infinite;
      }
      .anim-key-enter {
        animation: enterBloomPulse 4s ease-in-out infinite;
      }
      .anim-laser-r {
        stroke-dasharray: 260 500;
        animation: laserEnergyRun 7s ease-in-out infinite;
      }
      .wifi-arc-1 {
        transform-origin: 408px 120px;
        animation: wifiPulseWave1 7s ease-in-out infinite;
      }
      .wifi-arc-2 {
        transform-origin: 408px 120px;
        animation: wifiPulseWave2 7s ease-in-out infinite;
      }
      .blink-cursor {
        animation: cursorBlink 0.85s steps(1) infinite;
      }
      .led-dot {
        animation: ledBlink 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Radial Ambient Atmosphere -->
  <circle class="halo-atmosphere" cx="300" cy="300" r="270" fill="url(#haloGlow)" />

  <!-- MASTER CAMERA CONTAINER -->
  <g class="master-camera">

    <!-- Squircle Base -->
    <rect x="50" y="50" width="500" height="500" rx="124" fill="url(#bgGradClean)" stroke="url(#cyanBlueGradClean)" stroke-width="3" filter="url(#iconGlowClean)" />

    <!-- Background Technical Wireframe & Telemetry Matrix -->
    <g opacity="0.16" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
      <text x="86" y="112">&gt; PKT_STREAM: DIRECT_HID</text>
      <text x="86" y="128">LATENCY: &lt;0.5ms // 1000Hz</text>
      <text x="86" y="508">PORT: 8080 [WEBSOCKET_OPEN]</text>
      <text x="350" y="508">ENCODING: UTF-8 / PSK</text>
    </g>

    <!-- RADIATING SYNAPSE WIFI WAVES -->
    <g>
      <path class="wifi-arc-1" d="M 360 115 A 50 50 0 0 1 456 115" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />
      <path class="wifi-arc-2" d="M 338 92 A 80 80 0 0 1 478 92" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- PRO BADGE -->
    <g class="badge-pro-group" filter="url(#iconGlowClean)">
      <rect x="80" y="80" width="94" height="38" rx="11" fill="url(#cyanBlueGradClean)" />
      <text x="127" y="106" font-family="'JetBrains Mono', system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2.5" fill="#040d1a" text-anchor="middle">PRO</text>
    </g>

    <!-- FUTURISTIC 'R' MONOGRAM -->
    <g filter="url(#iconGlowClean)">
      <!-- Vertical Stem -->
      <rect x="100" y="152" width="52" height="288" rx="16" fill="url(#cyanBlueGradClean)" />

      <!-- Curved Head Base -->
      <path d="M 142 152 H 274 C 334 152, 364 180, 364 236 C 364 292, 334 320, 274 320 H 142 Z" fill="url(#cyanBlueGradClean)" />
      <!-- Inner Cutout -->
      <rect x="152" y="198" width="114" height="76" rx="18" fill="#091428" />

      <!-- Diagonal Leg -->
      <path d="M 250 304 L 340 440 H 272 L 200 328 Z" fill="url(#cyanBlueGradClean)" />

      <!-- High-Energy Kinetic Laser Outline running through the 'R' on Enter Strike -->
      <path class="anim-laser-r" d="M 100 440 V 152 H 274 C 334 152, 364 180, 364 236 C 364 292, 334 320, 274 320 L 340 440" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- KEYBOARD KEYCAPS MATRIX -->

    <!-- Keycap 1 -->
    <g class="anim-key-1" filter="url(#key3dShadow)">
      <rect x="360" y="164" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
      <rect x="364" y="168" width="38" height="38" rx="10" fill="#081426" />
      <circle cx="383" cy="187" r="5" class="led-dot" fill="#00f2fe" />
    </g>

    <!-- Keycap 2 -->
    <g class="anim-key-2" filter="url(#key3dShadow)">
      <rect x="418" y="164" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
      <rect x="422" y="168" width="38" height="38" rx="10" fill="#081426" />
      <circle cx="441" cy="187" r="5" class="led-dot" fill="#00f2fe" />
    </g>

    <!-- Keycap 3 -->
    <g class="anim-key-3" filter="url(#key3dShadow)">
      <rect x="360" y="224" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
      <rect x="364" y="228" width="38" height="38" rx="10" fill="#081426" />
      <rect x="375" y="245" width="16" height="4" rx="2" class="led-dot" fill="#00f2fe" />
    </g>

    <!-- Keycap 4 -->
    <g class="anim-key-4" filter="url(#key3dShadow)">
      <rect x="418" y="224" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
      <rect x="422" y="228" width="38" height="38" rx="10" fill="#081426" />
      <circle cx="441" cy="247" r="5" class="led-dot" fill="#00f2fe" />
    </g>

    <!-- ENTER KEYCAP -->
    <g class="anim-key-enter" filter="url(#bloomIntense)">
      <rect x="352" y="286" width="112" height="52" rx="15" fill="url(#cyanBlueGradClean)" />
      <path d="M 424 312 H 390 M 400 303 L 390 312 L 400 321" fill="none" stroke="#040d1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- SPACE BAR -->
    <g class="anim-key-space" filter="url(#key3dShadow)">
      <rect x="344" y="354" width="120" height="38" rx="12" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
      <rect x="348" y="358" width="112" height="30" rx="9" fill="#081426" />
      <rect x="382" y="371" width="44" height="4" rx="2" class="led-dot" fill="#00f2fe" />
    </g>

    <!-- INSTALLER TERMINAL PROMPT -->
    <g transform="translate(300, 472)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" letter-spacing="2" fill="#00ff88" text-anchor="middle">&gt; INSTALL_READY // 0ms</text>
      <rect class="blink-cursor" x="120" y="-11" width="8" height="14" fill="#00f2fe" />
    </g>

  </g>
</svg>
