<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote WiFi Keyboard • Pro Animated Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02050e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace;
    }

    .canvas-container {
      width: 100vmin;
      height: 100vmin;
      max-width: 600px;
      max-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* KEYFRAME SEQUENCES */

    /* 1. Master Camera Breathing & 3D Depth Zoom */
    @keyframes masterCameraZoom {
      0%, 100% {
        transform: scale(0.95) translateY(6px);
      }
      30% {
        transform: scale(1.04) translateY(-8px);
      }
      60% {
        transform: scale(1.08) translateY(-14px);
      }
      85% {
        transform: scale(0.98) translateY(0px);
      }
    }

    /* 2. PRO Badge Floating Glow */
    @keyframes proBadgeFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.45));
      }
      50% {
        transform: translateY(-6px) scale(1.05);
        filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.9));
      }
    }

    /* 3. Typing Sequence: Key 1 (<circle>) */
    @keyframes keyPress1 {
      0%, 100% { transform: translateY(0) scale(1); }
      10% { transform: translateY(-7px) scale(1.1); filter: drop-shadow(0 12px 16px rgba(0, 242, 254, 0.6)); }
      18% { transform: translateY(4px) scale(0.93); filter: drop-shadow(0 2px 6px rgba(0, 255, 136, 0.8)); }
      26% { transform: translateY(0) scale(1); }
    }

    /* 4. Typing Sequence: Key 2 */
    @keyframes keyPress2 {
      0%, 100% { transform: translateY(0) scale(1); }
      22% { transform: translateY(-7px) scale(1.1); filter: drop-shadow(0 12px 16px rgba(0, 242, 254, 0.6)); }
      30% { transform: translateY(4px) scale(0.93); filter: drop-shadow(0 2px 6px rgba(0, 240, 255, 0.8)); }
      38% { transform: translateY(0) scale(1); }
    }

    /* 5. Typing Sequence: Key 3 (Dash bar) */
    @keyframes keyPress3 {
      0%, 100% { transform: translateY(0) scale(1); }
      34% { transform: translateY(-7px) scale(1.1); filter: drop-shadow(0 12px 16px rgba(0, 242, 254, 0.6)); }
      42% { transform: translateY(4px) scale(0.93); filter: drop-shadow(0 2px 6px rgba(0, 255, 136, 0.8)); }
      50% { transform: translateY(0) scale(1); }
    }

    /* 6. Typing Sequence: Key 4 */
    @keyframes keyPress4 {
      0%, 100% { transform: translateY(0) scale(1); }
      46% { transform: translateY(-7px) scale(1.1); filter: drop-shadow(0 12px 16px rgba(0, 242, 254, 0.6)); }
      54% { transform: translateY(4px) scale(0.93); filter: drop-shadow(0 2px 6px rgba(0, 240, 255, 0.8)); }
      62% { transform: translateY(0) scale(1); }
    }

    /* 7. Typing Sequence: Space Bar */
    @keyframes keyPressSpace {
      0%, 100% { transform: translateY(0) scale(1); }
      58% { transform: translateY(-8px) scale(1.08); filter: drop-shadow(0 14px 20px rgba(0, 242, 254, 0.5)); }
      66% { transform: translateY(5px) scale(0.95); filter: drop-shadow(0 2px 8px rgba(0, 255, 136, 0.9)); }
      74% { transform: translateY(0) scale(1); }
    }

    /* 8. Typing Sequence: Heavy Return/Enter Strike */
    @keyframes keyPressEnter {
      0%, 100% { transform: translateY(0) scale(1); }
      72% { transform: translateY(-11px) scale(1.12); filter: drop-shadow(0 16px 24px rgba(0, 240, 255, 0.75)); }
      80% { transform: translateY(7px) scale(0.92); filter: drop-shadow(0 2px 12px rgba(0, 255, 136, 1)); }
      90% { transform: translateY(0) scale(1); }
    }

    /* 9. R Monogram Laser Dash Energy Wave (Triggered on Enter) */
    @keyframes laserEnergyRun {
      0% {
        stroke-dashoffset: 1400;
        opacity: 0.1;
      }
      74% {
        stroke-dashoffset: 1400;
        opacity: 0.2;
      }
      82% {
        opacity: 1;
        stroke-dashoffset: 700;
      }
      96% {
        stroke-dashoffset: 0;
        opacity: 0.9;
      }
      100% {
        stroke-dashoffset: -100;
        opacity: 0;
      }
    }

    /* 10. WiFi Concentric Synapse Radiation */
    @keyframes wifiPulseWave1 {
      0%, 75% { opacity: 0; transform: scale(0.7) translateY(8px); }
      80% { opacity: 1; stroke-width: 4; }
      92% { opacity: 0.8; transform: scale(1.1) translateY(-4px); }
      100% { opacity: 0; transform: scale(1.35) translateY(-14px); stroke-width: 1; }
    }
    @keyframes wifiPulseWave2 {
      0%, 78% { opacity: 0; transform: scale(0.8) translateY(8px); }
      84% { opacity: 1; stroke-width: 3.5; }
      95% { opacity: 0.7; transform: scale(1.18) translateY(-6px); }
      100% { opacity: 0; transform: scale(1.42) translateY(-18px); stroke-width: 1; }
    }

    /* 11. Terminal Cursor Blink */
    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* 12. LED Flare on Keys */
    @keyframes ledBlink {
      0%, 100% { fill: #00f2fe; }
      20%, 40% { fill: #00ff88; filter: drop-shadow(0 0 6px #00ff88); }
    }

    /* Class bindings */
    .master-camera {
      transform-origin: 300px 300px;
      animation: masterCameraZoom 5.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .badge-pro-group {
      transform-origin: 100px 75px;
      animation: proBadgeFloat 3.2s ease-in-out infinite;
    }

    .anim-key-1 {
      transform-origin: 383px 163px;
      animation: keyPress1 5.5s ease-in-out infinite;
    }

    .anim-key-2 {
      transform-origin: 441px 163px;
      animation: keyPress2 5.5s ease-in-out infinite;
    }

    .anim-key-3 {
      transform-origin: 383px 223px;
      animation: keyPress3 5.5s ease-in-out infinite;
    }

    .anim-key-4 {
      transform-origin: 441px 223px;
      animation: keyPress4 5.5s ease-in-out infinite;
    }

    .anim-key-space {
      transform-origin: 404px 349px;
      animation: keyPressSpace 5.5s ease-in-out infinite;
    }

    .anim-key-enter {
      transform-origin: 408px 288px;
      animation: keyPressEnter 5.5s ease-in-out infinite;
    }

    .anim-laser-r {
      stroke-dasharray: 220 500;
      animation: laserEnergyRun 5.5s linear infinite;
    }

    .wifi-arc-1 {
      transform-origin: 408px 120px;
      animation: wifiPulseWave1 5.5s ease-out infinite;
    }

    .wifi-arc-2 {
      transform-origin: 408px 120px;
      animation: wifiPulseWave2 5.5s ease-out infinite;
    }

    .blink-cursor {
      animation: cursorBlink 0.85s steps(1) infinite;
    }

    .led-dot {
      animation: ledBlink 5.5s ease-in-out infinite;
    }
  </style>
</head>
<body>

<div class="canvas-container">
  <svg width="100%" height="100%" viewBox="0 0 600 600" style="background: transparent; overflow: visible;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Deep Obsidian Background -->
      <linearGradient id="bgGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0d182e"/>
        <stop offset="50%" stop-color="#081020"/>
        <stop offset="100%" stop-color="#040812"/>
      </linearGradient>

      <!-- Signature Cyber Cyan / Azure Gradient -->
      <linearGradient id="cyanBlueGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f2fe"/>
        <stop offset="40%" stop-color="#00c0ff"/>
        <stop offset="100%" stop-color="#0061ff"/>
      </linearGradient>

      <!-- High Voltage Kinetic Pulse Gradient -->
      <linearGradient id="neonLaserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff"/>
        <stop offset="45%" stop-color="#00ff88"/>
        <stop offset="100%" stop-color="#0061ff"/>
      </linearGradient>

      <!-- Keycap Bevel Gradient -->
      <linearGradient id="keycapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#142646"/>
        <stop offset="100%" stop-color="#091428"/>
      </linearGradient>

      <!-- Radial Ambient Halo -->
      <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32"/>
        <stop offset="50%" stop-color="#0061ff" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <!-- Filters for High-End Bloom & 3D Drop Shadows -->
      <filter id="iconGlowClean" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="bloomIntense" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="12" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="key3dShadow" x="-30%" y="-30%" width="160%" height="180%">
        <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.75"/>
      </filter>
    </defs>

    <!-- Radial Ambient Atmosphere -->
    <circle cx="300" cy="300" r="270" fill="url(#haloGlow)" />

    <!-- MASTER CAMERA CONTAINER (Handles 3D Zoom In/Out & Parallax) -->
    <g class="master-camera">

      <!-- Squircle Base (Pro Physical Icon Contour) -->
      <rect x="50" y="50" width="500" height="500" rx="124" fill="url(#bgGradClean)" stroke="url(#cyanBlueGradClean)" stroke-width="3" filter="url(#iconGlowClean)" />

      <!-- Background Technical Wireframe & Telemetry Matrix -->
      <g opacity="0.16" fill="#00f2fe" font-size="10" font-weight="700">
        <text x="86" y="112">&gt; PKT_STREAM: DIRECT_HID</text>
        <text x="86" y="128">LATENCY: &lt;0.5ms // 1000Hz</text>
        <text x="86" y="508">PORT: 8080 [WEBSOCKET_OPEN]</text>
        <text x="350" y="508">ENCODING: UTF-8 / PSK</text>
      </g>

      <!-- RADIATING SYNAPSE WIFI WAVES (Emits on Enter Press) -->
      <g>
        <path class="wifi-arc-1" d="M 360 115 A 50 50 0 0 1 456 115" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />
        <path class="wifi-arc-2" d="M 338 92 A 80 80 0 0 1 478 92" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- PRO BADGE (Floating with 3D Elevation at Top-Left) -->
      <g class="badge-pro-group" filter="url(#iconGlowClean)">
        <rect x="80" y="80" width="94" height="38" rx="11" fill="url(#cyanBlueGradClean)" />
        <text x="127" y="106" font-family="'JetBrains Mono', system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2.5" fill="#040d1a" text-anchor="middle">PRO</text>
      </g>

      <!-- FUTURISTIC 'R' MONOGRAM (Heart of the Architecture) -->
      <g filter="url(#iconGlowClean)">
        <!-- Vertical Stem -->
        <rect x="100" y="152" width="52" height="288" rx="16" fill="url(#cyanBlueGradClean)" />

        <!-- Curved Head Base -->
        <path d="M 142 152 H 274 C 334 152, 364 180, 364 236 C 364 292, 334 320, 274 320 H 142 Z" fill="url(#cyanBlueGradClean)" />
        <!-- Inner Cutout -->
        <rect x="152" y="198" width="114" height="76" rx="18" fill="#091428" />

        <!-- Diagonal Leg -->
        <path d="M 250 304 L 340 440 H 272 L 200 328 Z" fill="url(#cyanBlueGradClean)" />

        <!-- High-Energy Kinetic Laser Outline running through the 'R' on Enter Strike -->
        <path class="anim-laser-r" d="M 100 440 V 152 H 274 C 334 152, 364 180, 364 236 C 364 292, 334 320, 274 320 L 340 440" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- KEYBOARD KEYCAPS MATRIX (Right-Hand Side Choreography) -->

      <!-- Keycap 1 (Top Left: 360, 164) -->
      <g class="anim-key-1" filter="url(#key3dShadow)">
        <rect x="360" y="164" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
        <rect x="364" y="168" width="38" height="38" rx="10" fill="#081426" />
        <circle cx="383" cy="187" r="5" class="led-dot" fill="#00f2fe" />
      </g>

      <!-- Keycap 2 (Top Right: 418, 164) -->
      <g class="anim-key-2" filter="url(#key3dShadow)">
        <rect x="418" y="164" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
        <rect x="422" y="168" width="38" height="38" rx="10" fill="#081426" />
        <circle cx="441" cy="187" r="5" class="led-dot" fill="#00f2fe" />
      </g>

      <!-- Keycap 3 (Middle Left: 360, 224 - Dash Key) -->
      <g class="anim-key-3" filter="url(#key3dShadow)">
        <rect x="360" y="224" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
        <rect x="364" y="228" width="38" height="38" rx="10" fill="#081426" />
        <rect x="375" y="245" width="16" height="4" rx="2" class="led-dot" fill="#00f2fe" />
      </g>

      <!-- Keycap 4 (Middle Right: 418, 224) -->
      <g class="anim-key-4" filter="url(#key3dShadow)">
        <rect x="418" y="224" width="46" height="46" rx="13" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
        <rect x="422" y="228" width="38" height="38" rx="10" fill="#081426" />
        <circle cx="441" cy="247" r="5" class="led-dot" fill="#00f2fe" />
      </g>

      <!-- ENTER KEYCAP (352, 286: Large Tactile Return Key) -->
      <g class="anim-key-enter" filter="url(#bloomIntense)">
        <rect x="352" y="286" width="112" height="52" rx="15" fill="url(#cyanBlueGradClean)" />
        <path d="M 424 312 H 390 M 400 303 L 390 312 L 400 321" fill="none" stroke="#040d1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- SPACE BAR (344, 354: Clean Extended Bar) -->
      <g class="anim-key-space" filter="url(#key3dShadow)">
        <rect x="344" y="354" width="120" height="38" rx="12" fill="url(#keycapGrad)" stroke="url(#cyanBlueGradClean)" stroke-width="1.8" />
        <rect x="348" y="358" width="112" height="30" rx="9" fill="#081426" />
        <rect x="382" y="371" width="44" height="4" rx="2" class="led-dot" fill="#00f2fe" />
      </g>

      <!-- INSTALLER TERMINAL PROMPT (Bottom Instrumentation) -->
      <g transform="translate(300, 472)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" letter-spacing="2" fill="#00ff88" text-anchor="middle">&gt; INSTALL_READY // 0ms</text>
        <rect class="blink-cursor" x="120" y="-11" width="8" height="14" fill="#00f2fe" />
      </g>

    </g>
  </svg>
</div>

</body>
</html>
