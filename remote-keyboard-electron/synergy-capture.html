<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>KDE Connect Mouse Hijack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      user-select: none;
      cursor: none; /* Cursor de Windows totalmente oculto */
    }

    /* HUD Cyberpunk Notificación Flotante Superior */
    #hud-overlay {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(6, 12, 26, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 9999px;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.3);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 99999;
      animation: fadeInHUD 0.3s ease;
    }

    @keyframes fadeInHUD {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f0ff;
      animation: pulseAnim 1.5s infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .key-badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="hud-overlay">
    <div class="pulse-dot"></div>
    <span>📱 Ratón Secuestrado en Android</span>
    <span style="color: #64748b;">|</span>
    <span>Presiona <span class="key-badge">ESC</span> o <span class="key-badge">Ctrl+Alt+M</span> para liberar</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let isCapturing = false;
    let virtualX = 0.5; // Comienza en el centro de la pantalla de Android
    let virtualY = 0.5;
    let sensitivity = 0.00085; // Relación ergonómica de desplazamiento relativo
    let throttleTimer = null;

    function requestLock() {
      try {
        if (document.body.requestPointerLock) {
          document.body.requestPointerLock();
        }
      } catch (err) {
        console.warn('Pointer lock request error:', err);
      }
    }

    function exitLock() {
      isCapturing = false;
      try {
        if (document.pointerLockElement) {
          document.exitPointerLock();
        }
      } catch (err) {}
      ipcRenderer.send('synergy-exit');
    }

    // Escuchar eventos de cambio de bloqueo de puntero
    document.addEventListener('pointerlockchange', () => {
      const locked = (document.pointerLockElement === document.body);
      if (locked) {
        isCapturing = true;
      } else {
        if (isCapturing) {
          // El usuario o el sistema liberó el puntero (ej. tecla Escape nativa)
          exitLock();
        }
      }
    });

    document.addEventListener('pointerlockerror', (err) => {
      console.warn('Pointer lock failed:', err);
    });

    // Re-adquirir bloqueo si el usuario hace clic en el área
    window.addEventListener('click', () => {
      if (!document.pointerLockElement) {
        requestLock();
      }
    });

    // Comunicación IPC desde el proceso principal
    ipcRenderer.on('capture-start', (event, currentCoords) => {
      isCapturing = true;
      if (currentCoords && typeof currentCoords.x === 'number') {
        virtualX = currentCoords.x;
        virtualY = currentCoords.y;
      }
      requestLock();
    });

    ipcRenderer.on('capture-stop', () => {
      exitLock();
    });

    ipcRenderer.on('set-sensitivity', (event, val) => {
      if (typeof val === 'number' && val > 0) {
        sensitivity = val;
      }
    });

    // Movimiento relativo 100% puro (dx, dy)
    window.addEventListener('mousemove', (e) => {
      if (!isCapturing && document.pointerLockElement !== document.body) return;

      const dx = e.movementX || 0;
      const dy = e.movementY || 0;

      // Acumulación con clamp estricto al área [0.0, 1.0] de Android
      virtualX = Math.max(0, Math.min(1, virtualX + dx * sensitivity));
      virtualY = Math.max(0, Math.min(1, virtualY + dy * sensitivity));

      // Stream a 60 FPS sin saturar el bus IPC
      if (!throttleTimer) {
        throttleTimer = requestAnimationFrame(() => {
          ipcRenderer.send('synergy-mouse-move', { x: virtualX, y: virtualY });
          throttleTimer = null;
        });
      }
    });

    // Clics físicos: 0 = Izquierdo (Tap / Drag), 1 = Central (Home), 2 = Derecho (Atrás)
    window.addEventListener('mousedown', (e) => {
      e.preventDefault();
      ipcRenderer.send('synergy-mouse-click', { button: e.button, action: 'down' });
    });

    window.addEventListener('mouseup', (e) => {
      e.preventDefault();
      ipcRenderer.send('synergy-mouse-click', { button: e.button, action: 'up' });
    });

    // Rueda del ratón para scroll vertical en Android
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.sign(e.deltaY);
      ipcRenderer.send('synergy-mouse-scroll', { deltaY: delta });
    }, { passive: false });

    // Desactivar menú contextual nativo de Windows (clic derecho = botón Atrás en Android)
    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // Liberación rápida con Escape o Ctrl+Alt+M
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || (e.ctrlKey && e.altKey && (e.code === 'KeyM' || e.key.toLowerCase() === 'm'))) {
        e.preventDefault();
        exitLock();
      }
    });

    // Auto-bloquear al cargar
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(requestLock, 100);
    });
  </script>
</body>
</html>
