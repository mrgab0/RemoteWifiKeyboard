<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>KDE Connect Mouse Hijack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: rgba(6, 12, 24, 0.22); /* Superficie hit-test 100% sólida: cero clics traspasan a Windows */
      user-select: none;
      cursor: none !important;
    }

    #surface {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: none !important;
    }

    /* HUD Cyberpunk Notificación Flotante Superior */
    #hud-overlay {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(6, 12, 26, 0.94);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 9999px;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.3);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 99999;
      animation: fadeInHUD 0.3s ease;
    }

    @keyframes fadeInHUD {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f0ff;
      animation: pulseAnim 1.5s infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .key-badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="surface"></div>
  <div id="hud-overlay">
    <div class="pulse-dot"></div>
    <span>📱 Ratón Secuestrado en Android (Windows Bloqueado)</span>
    <span style="color: #64748b;">|</span>
    <span>Presiona <span class="key-badge">ESC</span> o <span class="key-badge">Ctrl+Alt+M</span> para liberar</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const surface = document.getElementById('surface');
    let isCapturing = false;
    let virtualX = 0.5;
    let virtualY = 0.5;
    let sensitivity = 0.00085;
    let throttleTimer = null;

    function requestLock() {
      try {
        const target = surface || document.body;
        if (target.requestPointerLock) {
          const res = target.requestPointerLock();
          if (res && res.catch) {
            res.catch(err => {
              console.warn('Pointer lock catch:', err);
            });
          }
        }
      } catch (err) {}
    }

    function exitLock() {
      isCapturing = false;
      try {
        if (document.pointerLockElement) {
          document.exitPointerLock();
        }
      } catch (err) {}
      ipcRenderer.send('synergy-exit');
    }

    document.addEventListener('pointerlockchange', () => {
      const locked = (document.pointerLockElement === surface || document.pointerLockElement === document.body);
      if (locked) {
        isCapturing = true;
      } else {
        if (isCapturing) {
          exitLock();
        }
      }
    });

    document.addEventListener('pointerlockerror', (err) => {
      console.warn('Pointer lock error:', err);
    });

    ipcRenderer.on('capture-start', (event, currentCoords) => {
      isCapturing = true;
      if (currentCoords && typeof currentCoords.x === 'number') {
        virtualX = currentCoords.x;
        virtualY = currentCoords.y;
      }
      setTimeout(requestLock, 50);
    });

    ipcRenderer.on('capture-stop', () => {
      exitLock();
    });

    ipcRenderer.on('set-sensitivity', (event, val) => {
      if (typeof val === 'number' && val > 0) {
        sensitivity = val;
      }
    });

    // Movimiento relativo 100% puro
    window.addEventListener('mousemove', (e) => {
      const dx = e.movementX || 0;
      const dy = e.movementY || 0;

      virtualX = Math.max(0, Math.min(1, virtualX + dx * sensitivity));
      virtualY = Math.max(0, Math.min(1, virtualY + dy * sensitivity));

      if (!throttleTimer) {
        throttleTimer = requestAnimationFrame(() => {
          ipcRenderer.send('synergy-mouse-move', { 
            x: Math.round(virtualX * 10000) / 10000, 
            y: Math.round(virtualY * 10000) / 10000 
          });
          throttleTimer = null;
        });
      }
    }, true);

    // Interceptar y aislar 100% de clics en Windows
    window.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!document.pointerLockElement) {
        requestLock();
      }
      ipcRenderer.send('synergy-mouse-click', { button: e.button, action: 'down' });
    }, true);

    window.addEventListener('mouseup', (e) => {
      e.preventDefault();
      e.stopPropagation();
      ipcRenderer.send('synergy-mouse-click', { button: e.button, action: 'up' });
    }, true);

    window.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!document.pointerLockElement) {
        requestLock();
      }
    }, true);

    window.addEventListener('auxclick', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const delta = Math.sign(e.deltaY);
      ipcRenderer.send('synergy-mouse-scroll', { deltaY: delta });
    }, { passive: false, capture: true });

    window.addEventListener('dragstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);

    window.addEventListener('selectstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);

    // Escape o Ctrl+Alt+M para liberar
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || (e.ctrlKey && e.altKey && (e.code === 'KeyM' || e.key.toLowerCase() === 'm'))) {
        e.preventDefault();
        e.stopPropagation();
        exitLock();
      }
    }, true);

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(requestLock, 100);
    });
  </script>
</body>
</html>
